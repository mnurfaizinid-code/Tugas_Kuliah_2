    <!DOCTYPE html>
    <html lang="id">
   <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hitung Nilai Akhir</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

    <div class="card">
        <h2>Hadapilah kenyataan kawan</h2>

        <div class="form-group">
            <label for="tugas">Hasil Tugas:</label>
            <input type="number" id="tugas" placeholder="0-100">
        </div>

        <div class="form-group">
            <label for="uts">Hasil UTS:</label>
            <input type="number" id="uts" placeholder="0-100">
        </div>

        <div class="form-group">
            <label for="uas">Hasil UAS:</label>
            <input type="number" id="uas" placeholder="0-100">
        </div>

        <button class="btn-utama" onclick="hitungNilai()">Hitung</button>
        <p id="hasil"></p>
    </div>    

    <div class="card">
        <h2>Daftar Tugas</h2>
        <div class="input-row">
            <input type="text" id="input-tugas" placeholder="Tulis tugas...">
            <button class="btn-utama" onclick="tambahTugas()">Tambah</button>
        </div>
        <ul id="daftar"></ul>
    </div>

    <script src="script.js"></script>

    </body>
    </html>
