    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hitung Nilai Akhir</title>

    <body>

    <h2>Hadapilah kenyataan kawan</h2>

        <label for="tugas">Hasil Tugas:</label>

        <label for="uts">Hasil UTS:</label>

        <label for="uas">Hasil UAS:</label>
        <input type="number" id="uas" placeholder="0-100">
    </div>

    <button onclick="hitungNilai()">Hitung</button>

    <p id="hasil"></p>
